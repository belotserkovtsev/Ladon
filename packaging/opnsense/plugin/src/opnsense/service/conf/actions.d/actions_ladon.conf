[start]
command:/usr/local/etc/rc.d/ladon start
parameters:
type:script
message:Starting Ladon

[stop]
command:/usr/local/etc/rc.d/ladon stop
parameters:
type:script
message:Stopping Ladon

[restart]
command:/usr/local/etc/rc.d/ladon restart
parameters:
type:script
message:Restarting Ladon

[status]
command:/usr/local/etc/rc.d/ladon status
parameters:
errors:no
type:script_output
message:Request Ladon status

[reconfigure]
command:/bin/sh /usr/local/opnsense/scripts/OPNsense/Ladon/reconfigure.sh
parameters:
type:script
message:Reconfigure Ladon

[ensure_aliases]
command:/usr/local/bin/php /usr/local/opnsense/scripts/OPNsense/Ladon/ensure_aliases.php
parameters:
errors:no
type:script_output
message:Ensure Ladon firewall aliases

[doctor]
command:/usr/local/bin/ladon -db /var/db/ladon/engine.db doctor -json; exit 0
parameters:
errors:no
type:script_output
message:Ladon doctor

[hot]
command:/usr/local/bin/ladon -db /var/db/ladon/engine.db hot -json; exit 0
parameters:
errors:no
type:script_output
message:Ladon hot domains

[recent]
command:/usr/local/bin/ladon -db /var/db/ladon/engine.db list 200 -json; exit 0
parameters:
errors:no
type:script_output
message:Ladon recent domains

[why]
command:/usr/local/bin/ladon -db /var/db/ladon/engine.db why
parameters:%s
errors:no
type:script_output
message:Ladon why domain
