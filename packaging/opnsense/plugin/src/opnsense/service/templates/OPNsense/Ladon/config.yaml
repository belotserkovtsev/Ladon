# Generated by OPNsense (os-ladon) from the GUI settings. Do not edit by hand.
# Only operator-chosen values are written; everything else auto-defaults.
{% set g = OPNsense.ladon.general %}
{% if g.allow_extensions|default('') != '' or g.deny_extensions|default('') != '' %}
extensions_path: /usr/local/share/ladon/extensions
{% endif %}
{% if g.probe_mode|default('local') == 'exit-compare' %}
probe:
  mode: exit-compare
  remote:
    url: {{ g.remote_url }}
{% if g.remote_auth|default('') != '' %}
    auth_header: Authorization
    auth_value: {{ g.remote_auth }}
{% endif %}
{% endif %}
{% if g.promote_threshold|default('') != '' %}
scorer:
  promote_threshold: {{ g.promote_threshold }}
{% endif %}
{% if g.hot_ttl|default('') != '' %}
hot_ttl: {{ g.hot_ttl }}
{% endif %}
{% if g.family_confirm_threshold|default('') != '' %}
family_confirm_threshold: {{ g.family_confirm_threshold }}
{% endif %}
{% if g.ignore_peer|default('') != '' %}
ignore_peer: {{ g.ignore_peer }}
{% endif %}
{% if g.log_level|default('info') not in ['', 'info'] %}
log:
  level: {{ g.log_level }}
{% endif %}
{% if g.allow_extensions|default('') != '' %}
allow_extensions:
{% for x in g.allow_extensions.split(',') %}
  - {{ x }}
{% endfor %}
{% endif %}
{% if g.deny_extensions|default('') != '' %}
deny_extensions:
{% for x in g.deny_extensions.split(',') %}
  - {{ x }}
{% endfor %}
{% endif %}
{% if g.manual_allow|default('') != '' %}
manual_allow: /usr/local/etc/ladon/manual-allow.txt
{% endif %}
{% if g.manual_deny|default('') != '' %}
manual_deny: /usr/local/etc/ladon/manual-deny.txt
{% endif %}
