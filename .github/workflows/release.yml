name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  pull-requests: read

jobs:
  build:
    name: 🏗 build ${{ matrix.arch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: build static binary
        env:
          ARCH: ${{ matrix.arch }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          STAGE="dist/ladon-linux-${ARCH}-${TAG}"
          mkdir -p "${STAGE}"
          CGO_ENABLED=0 GOOS=linux GOARCH="${ARCH}" \
            go build -trimpath -ldflags="-s -w -X main.version=${TAG}" \
            -o "${STAGE}/ladon" ./cmd/ladon

          # Tarball is runtime-only — docs (README, install, methodology, etc.)
          # live in the repo under docs/ and are read on GitHub.
          cp release/ladon.service            "${STAGE}/"
          cp release/manual-allow.txt.example "${STAGE}/"
          cp release/manual-deny.txt.example  "${STAGE}/"
          cp release/config.yaml.example      "${STAGE}/"
          cp release/install.sh               "${STAGE}/"
          cp release/uninstall.sh             "${STAGE}/"
          cp -r release/extensions            "${STAGE}/"

          tar -czf "dist/ladon-linux-${ARCH}.tar.gz" -C dist "ladon-linux-${ARCH}-${TAG}"
          # sha256 file must contain the bare filename so `sha256sum -c` works
          # when the user downloads the tarball into an arbitrary directory.
          (cd dist && sha256sum "ladon-linux-${ARCH}.tar.gz" \
            > "ladon-linux-${ARCH}.tar.gz.sha256")

      - name: upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ladon-linux-${{ matrix.arch }}
          path: |
            dist/ladon-linux-${{ matrix.arch }}.tar.gz
            dist/ladon-linux-${{ matrix.arch }}.tar.gz.sha256
          retention-days: 7

  build-freebsd:
    name: 🏗 build freebsd (engine + os-ladon plugin)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: build freebsd bundle
        # amd64 only — OPNsense is amd64. The .so is built on the target box, so
        # the plugin tree is arch-neutral; just the Go engine binary is GOARCH-set.
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          STAGE="dist/ladon-freebsd-amd64-${TAG}"
          mkdir -p "${STAGE}/plugin"
          CGO_ENABLED=0 GOOS=freebsd GOARCH=amd64 \
            go build -trimpath -ldflags="-s -w -X main.version=${TAG}" \
            -o "${STAGE}/ladon" ./cmd/ladon

          # plugin/ mirrors the OPNsense hier with the src/ level stripped:
          #   plugin/{etc,opnsense,share} → /usr/local/{etc,opnsense,share}
          # which is exactly what install.sh `cp -R "$SRC/plugin/." /usr/local/`
          # expects. .gitattributes keeps these scripts LF, so the checkout
          # carries no CRLF into the tarball.
          cp -R release/opnsense/plugin/src/. "${STAGE}/plugin/"

          tar -czf "dist/ladon-freebsd-amd64.tar.gz" -C dist "ladon-freebsd-amd64-${TAG}"
          (cd dist && sha256sum "ladon-freebsd-amd64.tar.gz" \
            > "ladon-freebsd-amd64.tar.gz.sha256")

      - name: upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ladon-freebsd-amd64
          path: |
            dist/ladon-freebsd-amd64.tar.gz
            dist/ladon-freebsd-amd64.tar.gz.sha256
          retention-days: 7

  publish:
    name: 📦 publish release
    needs: [build, build-freebsd]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: list bundle
        run: ls -la dist/

      - name: stage standalone install scripts
        # Publish install.sh / uninstall.sh as separate release assets too. Bake
        # THIS release's tag into the published install.sh as the default TAG, so a
        # tester who runs it without TAG= installs THIS release's bundles — not
        # whatever /releases/latest resolves to (a prerelease beta is never
        # "latest", and an older stable tag predates the freebsd bundles). The
        # in-repo install.sh keeps TAG="${TAG:-}" = follow-latest for local use.
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          cp release/install.sh   dist/install.sh
          cp release/uninstall.sh dist/uninstall.sh
          sed -i "s|^TAG=\"\${TAG:-}\"|TAG=\"\${TAG:-${TAG_NAME}}\"|" dist/install.sh
          grep -q "^TAG=\"\${TAG:-${TAG_NAME}}\"\$" dist/install.sh \
            || { echo "could not bake TAG into install.sh — the TAG= line format changed"; exit 1; }
          chmod +x dist/install.sh dist/uninstall.sh

      - name: release notes from the merged PR description
        # The tagged commit is the PR's squash/merge commit, whose message
        # carries "(#NN)". Pull that PR's body and use it verbatim as the
        # release notes — the curated description, not an autogenerated commit
        # list. Falls back to GitHub's autogeneration if no PR is found.
        id: notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          pr=$(git log -1 --pretty=%B "${{ github.sha }}" | grep -oE '#[0-9]+' | head -1 | tr -d '#' || true)
          if [ -z "${pr:-}" ]; then
            pr=$(gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/pulls" \
                   --jq '.[0].number // empty' 2>/dev/null || true)
          fi
          if [ -n "${pr:-}" ] && gh api "repos/${{ github.repository }}/pulls/${pr}" --jq '.body // ""' > notes.md && [ -s notes.md ]; then
            echo "have_notes=true" >> "$GITHUB_OUTPUT"
            echo "release notes taken from PR #${pr}"
          else
            echo "have_notes=false" >> "$GITHUB_OUTPUT"
            echo "no PR description found — falling back to autogenerated notes"
          fi

      - name: publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/*.sha256
            dist/install.sh
            dist/uninstall.sh
          body_path: ${{ steps.notes.outputs.have_notes == 'true' && 'notes.md' || '' }}
          generate_release_notes: ${{ steps.notes.outputs.have_notes != 'true' }}
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
